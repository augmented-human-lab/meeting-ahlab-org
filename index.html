<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AHLab · Group Meeting</title>
  <meta name="description" content="AHLab bi-weekly group meeting dashboard — agenda, people, grants, papers, projects, students and travel.">
  <link rel="icon" href="https://cdn.ahlab.org/media/site/cropped-Group@2x-192x192.png">
  <link rel="apple-touch-icon" href="https://cdn.ahlab.org/media/site/cropped-Group@2x-192x192.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#6100FF">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AHL Meeting">
  <style>
    html, body { margin: 0; height: 100%; background: #0E0F11; overscroll-behavior: none; }
    iframe { width: 100%; height: 100%; border: 0; display: block; background: #F4F7F9; }
    .fallback {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(221deg, #00D7EE 0%, #6100FF 100%);
      color: #fff;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      text-align: center;
      padding: 24px;
    }
    .fallback a { color: #fff; }
  </style>
</head>
<body>
  <!-- Domain-scoped web-app address (/a/macros/ahlab.org/…). The plain
       /macros/s/<id>/exec form is served as the browser's DEFAULT Google
       account, which is the wrong one for anyone signed in to a personal
       Gmail alongside their AHL account. -->
  <iframe
    src="https://script.google.com/a/macros/ahlab.org/s/AKfycbyncFllmgHMBcyCc0tCJi5bvQC-cdzsHOPBrI04c87_gzrba0ovo7-bYttGZzD-gPik/exec"
    title="AHLab Group Meeting"
    allow="fullscreen; clipboard-write">
  </iframe>
  <script>
    // Register the service worker so the install prompt fires + the
    // wrapper shell works offline. Fails silently in unsupported
    // browsers.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/sw.js').catch(function (err) {
          console.warn('Service worker registration failed:', err);
        });
      });
    }
  </script>
  <noscript>
    <div class="fallback">
      <p>
        JavaScript is required.
        <br><br>
        Open
        <a href="https://script.google.com/a/macros/ahlab.org/s/AKfycbyncFllmgHMBcyCc0tCJi5bvQC-cdzsHOPBrI04c87_gzrba0ovo7-bYttGZzD-gPik/exec">
          the app directly
        </a>.
      </p>
    </div>
  </noscript>
</body>
</html>
