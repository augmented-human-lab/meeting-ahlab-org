<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AHLab · Group Meeting</title>
  <meta name="description" content="AHLab bi-weekly group meeting dashboard — agenda, people, grants, papers, projects, students and travel.">
  <link rel="icon" href="https://cdn.ahlab.org/media/site/cropped-Group@2x-192x192.png">
  <link rel="apple-touch-icon" href="https://cdn.ahlab.org/media/site/cropped-Group@2x-192x192.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#6100FF">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AHL Meeting">
  <style>
    html, body { margin: 0; height: 100%; background: #0E0F11; overscroll-behavior: none; }
    iframe { width: 100%; height: 100%; border: 0; display: block; background: #F4F7F9; }
    /* Shown only when the app never reports in — i.e. Google replaced it
       with a sign-in page the browser won't let us frame. */
    .gate {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      padding: 24px; box-sizing: border-box; font-family: "neue-haas-grotesk-text", system-ui, sans-serif;
      background:
        radial-gradient(60% 40% at 0% 0%, rgba(0,215,238,.10), transparent 70%),
        radial-gradient(50% 50% at 100% 100%, rgba(97,0,255,.08), transparent 70%), #F4F7F9;
      color: #0E0F11;
    }
    .gate-card {
      max-width: 440px; background: #fff; border-radius: 16px; padding: 36px 32px; text-align: center;
      box-shadow: 0 1px 2px rgba(14,15,17,.04), 0 8px 24px rgba(14,15,17,.06);
    }
    .gate-card img { width: 52px; height: 52px; border-radius: 50%; margin-bottom: 18px; }
    /* The logo doubles as the loading indicator. */
    .gate-card img.spin { animation: ahl-spin 1.5s linear infinite; }
    @keyframes ahl-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .gate-card img.spin { animation-duration: 4s; }
    }
    .gate-card h1 { font-weight: 800; font-size: 21px; margin: 0 0 10px; }
    /* The ready card has no body text, so the button needs the breathing room
       the paragraph used to provide. */
    .gate-card h1 + a.btn { margin-top: 12px; }
    .gate-card p { color: #5E6875; font-size: 14px; line-height: 1.55; margin: 0 0 22px; text-wrap: balance; }
    .gate-card .alt { display: block; margin-top: 16px; font-size: 12px; color: #838D95; }
    .gate-card .acct { display: block; margin-top: 14px; font-size: 13px; color: #5E6875; }
    .gate-card .acct b { font-weight: 600; color: #0E0F11; }
    .gate-card .alt a { color: #6100FF; text-decoration: none; }
    .gate-card a.btn {
      display: inline-flex; align-items: center; gap: 10px; text-decoration: none;
      font-weight: 600; font-size: 14px; color: #fff; padding: 12px 22px; border-radius: 999px;
      background: linear-gradient(221deg, #00D7EE 0%, #6100FF 100%);
      box-shadow: 0 6px 18px rgba(97,0,255,.22);
    }
    /* Signed-in member's photo, tucked against the button's left edge so the
       circle sits flush inside the pill. Only rendered once a previous visit
       has told us who they are. */
    .gate-card a.btn.has-avatar { padding-left: 5px; }
    .gate-card a.btn .btn-avatar {
      width: 32px; height: 32px; border-radius: 50%; margin: 0; display: block;
      object-fit: cover; background: rgba(255,255,255,.25);
      box-shadow: 0 0 0 2px rgba(255,255,255,.35);
    }
    [hidden] { display: none !important; }
    .fallback {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(221deg, #00D7EE 0%, #6100FF 100%);
      color: #fff;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      text-align: center;
      padding: 24px;
    }
    .fallback a { color: #fff; }
  </style>
</head>
<body>
  <!-- Plain /macros/s/<id>/exec on purpose. The domain-scoped
       /a/macros/ahlab.org/ form returns Google's own "401. That's an error."
       page when the browser's default account is a personal Gmail, and that
       error renders inside this frame. The plain form always runs the app,
       which then offers the account chooser itself. -->
  <iframe
    id="appFrame"
    src="https://script.google.com/macros/s/AKfycbyncFllmgHMBcyCc0tCJi5bvQC-cdzsHOPBrI04c87_gzrba0ovo7-bYttGZzD-gPik/exec?embed=1"
    title="AHLab Group Meeting"
    allow="fullscreen; clipboard-write">
  </iframe>
  <div class="gate" id="frameLoading">
    <div class="gate-card">
      <img class="spin" src="https://cdn.ahlab.org/media/site/black_logo_circle.png" alt="">
      <h1>Loading the meeting</h1>
      <p>Fetching the agenda, people and project updates.</p>
    </div>
  </div>

  <div class="gate" id="frameGate" hidden>
    <div class="gate-card">
      <img src="https://cdn.ahlab.org/media/site/black_logo_circle.png" alt="AHL">
      <h1>Meeting ready</h1>
      <!-- Straight to the domain-scoped URL, opened at top level. It resolves
           to the browser's @ahlab.org session whatever else is signed in, so
           there is nothing to pick; the account chooser only added a step
           whose answer it then ignored. The plain /macros/s/ URL is not usable
           here: with several sessions open Google rewrites it to
           /macros/u/<n>/s/… which dead-ends. This URL is also the one that
           renders Google's 401 page INSIDE the frame when there is no
           @ahlab.org session, which is why the frame above uses the plain
           form and this button does not. -->
      <a class="btn" id="gateBtn"
         href="https://script.google.com/a/macros/ahlab.org/s/AKfycbyncFllmgHMBcyCc0tCJi5bvQC-cdzsHOPBrI04c87_gzrba0ovo7-bYttGZzD-gPik/exec">
        <img class="btn-avatar" id="gateAvatar" alt="" hidden>
        <span>Open the meeting</span>
      </a>
      <span class="acct" id="gateAccount" hidden></span>
      <span class="alt">Opens with your <b>@ahlab.org</b> account.<br>
        Not signed in to one? <a href="https://accounts.google.com/AccountChooser?continue=https%3A%2F%2Fscript.google.com%2Fa%2Fmacros%2Fahlab.org%2Fs%2FAKfycbyncFllmgHMBcyCc0tCJi5bvQC-cdzsHOPBrI04c87_gzrba0ovo7-bYttGZzD-gPik%2Fexec">Add your AHL account</a>
      </span>
    </div>
  </div>

  <script>
    // The app posts {ahl:'ready'} as soon as its page runs. If nothing arrives,
    // Google replaced it inside the frame with a sign-in page that browsers
    // refuse to display framed (Safari, Firefox strict mode, private windows) —
    // so we show a card that opens the app in the full tab instead.
    (function () {
      var gate = document.getElementById('frameGate');
      var loading = document.getElementById('frameLoading');
      var ready = false;
      var USER_KEY = 'ahl-meeting-user-v1';

      function remember(user) {
        if (!user || !user.email) return;
        try { localStorage.setItem(USER_KEY, JSON.stringify(user)); } catch (e) {}
      }

      // The breakout card can't know who is signed in — that is the whole
      // reason it is showing. So it reuses the identity the app reported on a
      // previous visit, and simply omits the photo the first time.
      // The card can't know who is signed in — that is the whole reason it is
      // showing. So it reuses the identity the app reported on a previous
      // visit: the member's photo if we have one that loads, otherwise their
      // email address, otherwise nothing.
      function paintAccount() {
        var raw = null;
        try { raw = localStorage.getItem(USER_KEY); } catch (e) {}
        if (!raw) return;
        var user;
        try { user = JSON.parse(raw); } catch (e) { return; }
        if (!user) return;

        var label = document.getElementById('gateAccount');
        function showEmail() {
          if (!user.email) return;
          label.innerHTML = 'Opens as <b></b>';
          label.querySelector('b').textContent = user.email;
          label.hidden = false;
        }

        if (!user.photo) { showEmail(); return; }
        var img = document.getElementById('gateAvatar');
        var btn = document.getElementById('gateBtn');
        img.onload = function () {
          img.hidden = false;
          btn.classList.add('has-avatar');
        };
        // Directory photo URLs 403 for non-admin members, so a photo we were
        // given may still fail to render.
        img.onerror = showEmail;
        img.alt = user.name || user.email || '';
        img.src = user.photo;
      }

      // The app posts {ahl:'ready'} as soon as its page runs — from the viewer,
      // the sign-in card and the access-denied page alike. Until then an AHL
      // loading screen covers the frame, because what is behind it may be
      // Google's own error or sign-in page rather than our app.
      window.addEventListener('message', function (e) {
        if (!e.data || e.data.ahl !== 'ready') return;
        ready = true;
        loading.hidden = true;
        gate.hidden = true;
        remember(e.data.user);
      });

      // Nothing reported in: Google replaced the app inside the frame with a
      // page that refuses to be framed. Offer the full tab instead.
      setTimeout(function () {
        if (ready) return;
        loading.hidden = true;
        paintAccount();
        gate.hidden = false;
      }, 7000);
    })();
  </script>

  <script>
    // Register the service worker so the install prompt fires + the
    // wrapper shell works offline. Fails silently in unsupported
    // browsers.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/sw.js').catch(function (err) {
          console.warn('Service worker registration failed:', err);
        });
      });
    }
  </script>
  <noscript>
    <div class="fallback">
      <p>
        JavaScript is required.
        <br><br>
        Open
        <a href="https://script.google.com/macros/s/AKfycbyncFllmgHMBcyCc0tCJi5bvQC-cdzsHOPBrI04c87_gzrba0ovo7-bYttGZzD-gPik/exec">
          the app directly
        </a>.
      </p>
    </div>
  </noscript>
</body>
</html>
